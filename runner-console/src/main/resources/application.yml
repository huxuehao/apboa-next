spring:
  profiles:
    active: dev
  application:
    name: apboa-console
  servlet:
    multipart:
      max-file-size: 30MB # 单个文件最大 30MB
      max-request-size: 100MB # 请求总大小最大 100MB（假设最多3个30MB文件）
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
  # Flyway 数据库迁移配置
  flyway:
    locations: classpath:db/migration
    # 存量库（已通过 sql/db_init.sql 初始化）启动时自动创建历史表并标记基线 V1，增量脚本从 V2__ 开始
    baseline-on-migrate: true
    baseline-version: 1
    encoding: UTF-8
